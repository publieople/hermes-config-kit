<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=800">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:800px;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}

.card{
  width:100%;height:100%;
  background:#0b1122;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

.card::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px);
  background-size:48px 48px;
  mask:radial-gradient(ellipse 70% 55% at center,black 35%,transparent 75%);
}

.card::after{
  content:'';position:absolute;
  width:500px;height:300px;
  background:radial-gradient(ellipse,rgba(14,165,233,.05) 0%,transparent 70%);
  top:42%;left:50%;transform:translate(-50%,-50%);
}

.content{position:relative;z-index:1;text-align:center;padding:0 32px}

.tag{
  display:inline-block;
  border:1.5px solid rgba(56,189,248,.55);
  border-radius:24px;
  padding:10px 28px;
  color:#7dd3fc;
  font-size:20px;
  font-weight:600;
  letter-spacing:2px;
  margin-bottom:20px;
}

.title{
  font-size:72px;font-weight:900;color:#f8fafc;
  line-height:1.15;letter-spacing:3px;
}
.title .hl{color:#38bdf8}

.subtitle{
  color:#cbd5e1;font-size:24px;
  margin-top:10px;letter-spacing:1px;
  font-weight:500;
}

.badge{
  display:inline-block;
  margin-top:18px;
  border:1.5px solid rgba(56,189,248,.5);
  color:#7dd3fc;
  font-weight:600;font-size:22px;
  padding:10px 28px;border-radius:24px;
  letter-spacing:2px;
}

.features{
  display:flex;gap:24px;margin-top:24px;
}
.feat{
  color:#cbd5e1;font-size:19px;font-weight:500;
  display:flex;align-items:center;gap:6px;
}
.feat::before{content:'';width:7px;height:7px;background:#38bdf8;border-radius:50%;flex-shrink:0}

.notes{
  margin-top:20px;
  color:#64748b;font-size:14px;line-height:1.6;
}
.notes span{display:block}

.footer{
  position:absolute;bottom:20px;
  color:#94a3b8;font-size:16px;letter-spacing:1px;
}
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <div class="tag">🖥️ 远程帮装 · 装不上不要钱</div>
    <div class="title">
      AI Agent<br>
      <span class="hl">私有化部署</span>
    </div>
    <div class="subtitle">Hermes · Codex · OpenClaw · Claude Code</div>
    <div class="badge">远程一对一 · 装通为止</div>
    <div class="features">
      <span class="feat">Win / Mac / Linux</span>
      <span class="feat">QQ · 微信 · 飞书</span>
      <span class="feat">Docker · GPU 调优</span>
    </div>
    <div class="notes">
      <span>⚠️ 不包含 AI 模型 API / Token 费用，需自行购买</span>
      <span>⚠️ 请自备服务器或电脑，不代购账号</span>
    </div>
  </div>
  <div class="footer">拍前请先咨询 · 不代售 API Key</div>
</div>
</body>
</html>
