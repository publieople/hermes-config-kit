<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=800">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;height:800px;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif}

.card{
  width:100%;height:100%;
  background:#0b1122;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* subtle grid */
.card::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px);
  background-size:48px 48px;
  mask:radial-gradient(ellipse 70% 55% at center,black 35%,transparent 75%);
}

/* accent glow */
.card::after{
  content:'';position:absolute;
  width:420px;height:260px;
  background:radial-gradient(ellipse,rgba(14,165,233,.07) 0%,transparent 70%);
  top:38%;left:50%;transform:translate(-50%,-50%);
}

.content{position:relative;z-index:1;text-align:center}

.tag{
  display:inline-block;
  border:1.5px solid rgba(56,189,248,.55);
  border-radius:22px;
  padding:9px 30px;
  color:#7dd3fc;
  font-size:15px;
  font-weight:600;
  letter-spacing:3px;
  margin-bottom:32px;
}

.title{
  font-size:54px;font-weight:900;color:#f8fafc;
  line-height:1.25;letter-spacing:4px;
}
.title .hl{color:#38bdf8}

.subtitle{
  color:#cbd5e1;font-size:19px;
  margin-top:16px;letter-spacing:1.5px;
  font-weight:500;
}

.badge{
  display:inline-block;
  margin-top:30px;
  background:#0ea5e9;
  color:#fff;
  font-weight:800;font-size:24px;
  padding:12px 40px;border-radius:10px;
  letter-spacing:2px;
}

.features{
  display:flex;gap:28px;margin-top:38px;
}
.feat{
  color:#cbd5e1;font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.feat::before{content:'';width:6px;height:6px;background:#38bdf8;border-radius:50%;flex-shrink:0}

.footer{
  position:absolute;bottom:40px;
  color:#94a3b8;font-size:14px;letter-spacing:1px;
}
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <div class="tag">🖥️ 远程帮装 · 装不上不要钱</div>
    <div class="title">
      AI Agent<br>
      <span class="hl">私有化部署</span>
    </div>
    <div class="subtitle">Hermes · Codex · OpenClaw · Claude Code</div>
    <div class="badge">¥199 起</div>
    <div class="features">
      <span class="feat">Win / Mac / Linux</span>
      <span class="feat">QQ · 微信 · 飞书</span>
      <span class="feat">Docker · GPU 调优</span>
    </div>
  </div>
  <div class="footer">拍前请先咨询 · 不代售 API Key</div>
</div>
</body>
</html>
